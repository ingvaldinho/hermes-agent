name: Fork approval ingress v4

# Validation limitée au fork du propriétaire. Cette branche ne déploie rien.
# Les Actions doivent être activées sur le fork pour que le push crée un run.
on:
  push:
    branches:
      - ci/remediation-v4
      - fix/approval-socket-sender-credentials
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Install locked Hermes test environment
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all"]'
          test-environment: 'true'
      - name: Run approval ingress and Telegram admission tests
        env:
          HERMES_TEST_WORKERS: '2'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        run: |
          scripts/run_tests.sh \
            tests/gateway/test_approval_ingress_v3.py \
            tests/gateway/test_approval_ingress_v3_unittest.py \
            tests/plugins/test_telegram_update_admission.py \
            -j 2
